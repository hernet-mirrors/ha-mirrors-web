<!-- Site header: two-logo brand lockup (maintenance-page grouping) + nav on the right -->
<header class="site-header" role="banner">
  <div class="site-header-inner">
    {%- comment -%}
      header.brand_visible toggles the two brand logos. Unset or true -> show,
      explicit false -> hide. Defaults to shown.
    {%- endcomment -%}
    {% if site.header.brand_visible != false %}
    <a class="brand-main" href="{{ site.homelink | default: 'https://cips.nyist.edu.cn' }}" target="_blank" rel="noopener" aria-label="前往{{ site.school }}主站">
      <img src="{{ '/static/img/logo-share.png' | relative_url }}" alt="{{ site.school }}">
    </a>
    <div class="brand-sep" aria-hidden="true"></div>
    <a class="brand-mirror" href="{{ site.url | default: 'https://mirror.nyist.edu.cn' }}" aria-label="{{ site.title }}">
      <span>南阳理工学院开源软件镜像站</span>
    </a>
    {% endif %}

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>镜像列表</a>
      <a href="{{ '/help/' | relative_url }}" {% if page.url contains '/help' %}class="active"{% endif %}>使用帮助</a>
      <a href="{{ '/status/' | relative_url }}" {% if page.url contains '/status' %}class="active"{% endif %}>同步状态</a>
      <a href="{{ '/news/' | relative_url }}" {% if page.url contains '/news' %}class="active"{% endif %}>新闻公告</a>
    </nav>
  </div>
</header>
