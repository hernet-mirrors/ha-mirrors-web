---
layout: default
title: 同步状态
description: 查看各镜像的实时同步状态和统计信息
permalink: /status/
---

<div class="row">
    <div class="col-lg-8 col-12">
        <div class="card shadow-sm index-card">
            <div class="card-body">
                <div class="status-list-container">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3><i class="fas fa-chart-line"></i> 同步状态</h3>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th width="25%">镜像名称</th>
                                    <th width="12%">状态</th>
                                    <th width="18%">上次同步成功</th>
                                    <th width="18%">下次计划同步</th>
                                    <th width="15%">同步开始时间</th>
                                    <th width="12%">大小</th>
                                </tr>
                            </thead>
                            <tbody id="status-table-body">
                                <tr>
                                    <td colspan="6" class="text-center py-4">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">加载中...</span>
                                        </div>
                                        <p class="mt-2 mb-0 text-muted">正在加载同步状态...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧边栏 -->
    <div class="col-lg-4 col-12 sidebar-container">
        <div class="sidebar-content">
                <!-- 快速统计 -->
                <div class="card shadow-sm mb-4 status-card">
                    <div class="card-header status-card-header">
                        <h5 class="mb-0"><i class="fas fa-tachometer-alt"></i> 快速统计</h5>
                    </div>
                    <div class="card-body">
                        <div class="row text-center">
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-success" id="sidebar-success">--</div>
                                    <div class="stat-label small text-muted">正常</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-warning" id="sidebar-syncing">--</div>
                                    <div class="stat-label small text-muted">同步中</div>
                                </div>
                            </div>
                             <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-danger" id="sidebar-failed">--</div>
                                    <div class="stat-label small text-muted">失败</div>
                                </div>
                            </div>
                        </div>
                        <div class="row text-center mt-2">
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-info" id="sidebar-paused">--</div>
                                    <div class="stat-label small text-muted">暂停</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-secondary" id="sidebar-unknown">--</div>
                                    <div class="stat-label small text-muted">未知</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="stat-item">
                                    <div class="stat-number text-primary" id="sidebar-total">--</div>
                                    <div class="stat-label small text-muted">总计</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 同步状态说明 -->
                <div class="card shadow-sm mb-4 status-card">
                    <div class="card-header status-card-header">
                        <h5 class="mb-0"><i class="fas fa-question-circle"></i> 状态说明</h5>
                    </div>
                    <div class="card-body">
                        <div class="status-legend">
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-success me-2"><i class="fas fa-check"></i></span>
                                <span class="small">正常 - 镜像同步正常</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-warning me-2"><i class="fas fa-sync-alt fa-spin"></i></span>
                                <span class="small">同步中 - 正在进行同步</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-danger me-2"><i class="fas fa-times"></i></span>
                                <span class="small">失败 - 同步出现错误</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-info me-2"><i class="fas fa-pause"></i></span>
                                <span class="small">暂停 - 同步已暂停</span>
                            </div>
                            <div class="d-flex align-items-center mb-2">
                                <span class="badge bg-secondary me-2"><i class="fas fa-question"></i></span>
                                <span class="small">未知 - 状态未知</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 磁盘占用 -->
                <div class="card shadow-sm mb-4 status-card">
                    <div class="card-header status-card-header">
                        <h5 class="mb-0"><i class="fas fa-hdd"></i> 磁盘占用</h5>
                    </div>
                    <div class="card-body">
                        <div id="disk-info">
                            <div class="text-center py-3">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                                <p class="mt-2 mb-0 small text-muted">加载磁盘信息...</p>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="{{ '/static/css/status.css' | relative_url }}">
<script src="{{ '/static/js/status.js' | relative_url }}" defer></script>
