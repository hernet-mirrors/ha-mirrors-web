---
layout: page
title: 新闻公告
description: 查看镜像站的最新动态、维护通知和重要公告
---

<div class="row mb-4">
    <div class="col-md-8">
        <div class="d-flex align-items-center">
            <i class="fas fa-newspaper text-primary me-2 fa-2x"></i>
            <div>
                <h3 class="mb-0">新闻公告</h3>
                <small class="text-muted">了解镜像站的最新动态和重要通知</small>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="input-group">
            <input type="text" class="form-control" id="news-search" placeholder="搜索新闻...">
            <button class="btn btn-outline-secondary" type="button">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </div>
</div>

<!-- 分类筛选 -->
<div class="mb-4">
    <div class="btn-group" role="group" aria-label="新闻分类">
        <input type="radio" class="btn-check" name="category-filter" id="all-news" value="all" checked>
        <label class="btn btn-outline-primary" for="all-news">
            <i class="fas fa-list"></i> 全部
        </label>
        
        <input type="radio" class="btn-check" name="category-filter" id="announcements" value="news">
        <label class="btn btn-outline-primary" for="announcements">
            <i class="fas fa-bullhorn"></i> 公告
        </label>
        
        <input type="radio" class="btn-check" name="category-filter" id="maintenance" value="maintenance">
        <label class="btn btn-outline-primary" for="maintenance">
            <i class="fas fa-wrench"></i> 维护
        </label>
        
        <input type="radio" class="btn-check" name="category-filter" id="features" value="feature">
        <label class="btn btn-outline-primary" for="features">
            <i class="fas fa-star"></i> 新功能
        </label>
    </div>
</div>

<!-- 新闻列表 -->
<div class="news-container">
    <div id="news-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">加载中...</span>
        </div>
        <p class="mt-3 text-muted">正在加载新闻列表...</p>
    </div>
    
    <div id="news-list" style="display: none;">
        <!-- 新闻列表将在这里动态生成 -->
    </div>
    
    <div id="news-empty" class="text-center py-5" style="display: none;">
        <i class="fas fa-search fa-3x text-muted mb-3"></i>
        <h5 class="text-muted">没有找到相关新闻</h5>
        <p class="text-muted">尝试调整搜索条件或选择其他分类</p>
    </div>
</div>

<!-- 分页 -->
<nav aria-label="新闻分页" id="news-pagination" style="display: none;">
    <ul class="pagination justify-content-center">
        <!-- 分页将在这里动态生成 -->
    </ul>
</nav>

<script>
// 新闻数据 - 在实际应用中这应该从API获取
const newsData = [
    {
        title: "河南省教育科研网镜像站正式上线",
        excerpt: "河南省教育科研网开源软件镜像站今日正式上线，为河南省高校和科研院所提供高速稳定的开源软件镜像服务。",
        date: "2025-01-16",
        author: "镜像站管理员",
        category: "news",
        tags: ["公告", "镜像站"],
        url: "/news/2025/01/16/mirror-site-launch/",
        important: true
    },
    {
        title: "新增Docker Hub镜像加速服务",
        excerpt: "为方便用户使用Docker容器技术，我们新增了Docker Hub镜像加速服务，大幅提升Docker镜像下载速度。",
        date: "2025-01-15",
        author: "技术团队",
        category: "feature",
        tags: ["Docker", "新功能"],
        url: "/news/2025/01/15/docker-hub-mirror/",
        important: false
    },
    {
        title: "系统维护通知 - PyPI镜像升级",
        excerpt: "为提升PyPI镜像服务质量，我们将于1月14日21:00-23:00进行系统升级维护。",
        date: "2025-01-14",
        author: "运维团队",
        category: "maintenance",
        tags: ["维护", "PyPI"],
        url: "/news/2025/01/14/pypi-maintenance/",
        important: false
    }
];

let currentPage = 1;
const itemsPerPage = 5;
let filteredNews = [...newsData];

// 初始化
document.addEventListener('DOMContentLoaded', function() {
    loadNews();
    bindEvents();
});

// 绑定事件
function bindEvents() {
    // 搜索功能
    document.getElementById('news-search').addEventListener('input', function() {
        filterNews();
    });
    
    // 分类筛选
    document.querySelectorAll('input[name="category-filter"]').forEach(radio => {
        radio.addEventListener('change', function() {
            currentPage = 1;
            filterNews();
        });
    });
}

// 加载新闻
function loadNews() {
    const loading = document.getElementById('news-loading');
    
    // 模拟加载延迟
    setTimeout(() => {
        loading.style.display = 'none';
        renderNews();
    }, 1000);
}

// 筛选新闻
function filterNews() {
    const searchTerm = document.getElementById('news-search').value.toLowerCase();
    const selectedCategory = document.querySelector('input[name="category-filter"]:checked').value;
    
    filteredNews = newsData.filter(news => {
        const matchesSearch = !searchTerm || 
            news.title.toLowerCase().includes(searchTerm) ||
            news.excerpt.toLowerCase().includes(searchTerm) ||
            news.tags.some(tag => tag.toLowerCase().includes(searchTerm));
        
        const matchesCategory = selectedCategory === 'all' || news.category === selectedCategory;
        
        return matchesSearch && matchesCategory;
    });
    
    currentPage = 1;
    renderNews();
}

// 渲染新闻列表
function renderNews() {
    const container = document.getElementById('news-list');
    const emptyDiv = document.getElementById('news-empty');
    const paginationDiv = document.getElementById('news-pagination');
    
    if (filteredNews.length === 0) {
        container.style.display = 'none';
        paginationDiv.style.display = 'none';
        emptyDiv.style.display = 'block';
        return;
    }
    
    // 计算分页
    const totalPages = Math.ceil(filteredNews.length / itemsPerPage);
    const startIndex = (currentPage - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    const currentNews = filteredNews.slice(startIndex, endIndex);
    
    // 渲染新闻项
    let html = '';
    currentNews.forEach(news => {
        html += renderNewsItem(news);
    });
    
    container.innerHTML = html;
    container.style.display = 'block';
    emptyDiv.style.display = 'none';
    
    // 渲染分页
    if (totalPages > 1) {
        renderPagination(totalPages);
        paginationDiv.style.display = 'block';
    } else {
        paginationDiv.style.display = 'none';
    }
}

// 渲染单个新闻项
function renderNewsItem(news) {
    const categoryIcon = getCategoryIcon(news.category);
    const categoryText = getCategoryText(news.category);
    const importantBadge = news.important ? '<span class="badge bg-danger ms-2">重要</span>' : '';
    
    return `
        <article class="card mb-4 news-item">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-9">
                        <div class="d-flex align-items-start">
                            <div class="news-icon me-3">
                                <i class="${categoryIcon} fa-2x text-primary"></i>
                            </div>
                            <div class="flex-grow-1">
                                <h4 class="card-title">
                                    <a href="${news.url}" class="text-decoration-none">${news.title}</a>
                                    ${importantBadge}
                                </h4>
                                <p class="card-text text-muted">${news.excerpt}</p>
                                <div class="news-meta">
                                    <small class="text-muted">
                                        <i class="fas fa-calendar-alt"></i> ${formatDate(news.date)}
                                        <span class="mx-2">•</span>
                                        <i class="fas fa-user"></i> ${news.author}
                                        <span class="mx-2">•</span>
                                        <i class="${categoryIcon}"></i> ${categoryText}
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 text-end">
                        <div class="news-tags mb-2">
                            ${news.tags.map(tag => `<span class="badge bg-light text-dark me-1">${tag}</span>`).join('')}
                        </div>
                        <a href="${news.url}" class="btn btn-outline-primary btn-sm">
                            <i class="fas fa-arrow-right"></i> 阅读全文
                        </a>
                    </div>
                </div>
            </div>
        </article>
    `;
}

// 渲染分页
function renderPagination(totalPages) {
    const container = document.querySelector('#news-pagination .pagination');
    let html = '';
    
    // 上一页
    if (currentPage > 1) {
        html += `
            <li class="page-item">
                <a class="page-link" href="#" onclick="changePage(${currentPage - 1}); return false;">
                    <i class="fas fa-chevron-left"></i>
                </a>
            </li>
        `;
    }
    
    // 页码
    for (let i = 1; i <= totalPages; i++) {
        const isActive = i === currentPage ? 'active' : '';
        html += `
            <li class="page-item ${isActive}">
                <a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a>
            </li>
        `;
    }
    
    // 下一页
    if (currentPage < totalPages) {
        html += `
            <li class="page-item">
                <a class="page-link" href="#" onclick="changePage(${currentPage + 1}); return false;">
                    <i class="fas fa-chevron-right"></i>
                </a>
            </li>
        `;
    }
    
    container.innerHTML = html;
}

// 更改页码
function changePage(page) {
    currentPage = page;
    renderNews();
    
    // 滚动到顶部
    document.querySelector('.news-container').scrollIntoView({ 
        behavior: 'smooth' 
    });
}

// 获取分类图标
function getCategoryIcon(category) {
    const icons = {
        'news': 'fas fa-bullhorn',
        'maintenance': 'fas fa-wrench',
        'feature': 'fas fa-star'
    };
    return icons[category] || 'fas fa-file-alt';
}

// 获取分类文本
function getCategoryText(category) {
    const texts = {
        'news': '公告',
        'maintenance': '维护',
        'feature': '新功能'
    };
    return texts[category] || '其他';
}

// 格式化日期
function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
}
</script>

<style>
.news-item {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
}

.news-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.news-icon {
    min-width: 60px;
}

.news-meta {
    font-size: 0.9em;
}

.news-tags .badge {
    font-size: 0.75em;
}

@media (max-width: 768px) {
    .news-icon {
        display: none;
    }
    
    .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
    }
    
    .btn-group .btn {
        flex: 1;
        min-width: auto;
    }
}
</style>
