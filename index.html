<!-- 镜像列表表格 -->
<div class="mirror-list-container">
	<div class="d-flex justify-content-between align-items-center mb-3">
		<h3 style="color: #0A77FF; font-weight: 700;"><i class="fas fa-list"></i> 镜像列表</h3>
		<div class="mirror-search">
			<input type="text" class="form-control" id="mirror-search" placeholder="搜索镜像... (按 / 搜索)" style="border-color: #0A77FF;">
		</div>
	</div>
	
	<!-- 加载中状态 -->
	<div id="mirror-loading" class="text-center my-5">
		<div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
			<span class="visually-hidden">正在加载镜像列表...</span>
		</div>
		<p class="mt-3 text-muted">正在加载镜像列表...</p>
	</div>
	
	<!-- 镜像列表表格 (初始隐藏) -->
	<div id="mirror-table-container" class="mirror-table-container d-none">
		<table class="mirror-table" id="mirror-table" style="border: none;">
			<thead>
				<tr>
					<th style="width:40%">镜像名称</th>
					<th style="width:20%">大小</th>
					<th style="width:20%">同步状态</th>
					<th style="width:20%">最后更新</th>
				</tr>
			</thead>
			<tbody id="mirror-table-body">
				<!-- 镜像列表将通过 JavaScript 动态生成 -->
			</tbody>
		</table>
	</div>
	
	<!-- 错误状态 -->
	<div id="mirror-error" class="alert alert-warning d-none" role="alert">
		<h5><i class="fas fa-exclamation-triangle"></i> 镜像列表加载失败</h5>
		<p>无法加载镜像同步状态，可能的原因：</p>
		<ul>
			<li>网络连接问题</li>
			<li>镜像站服务器维护中</li>
		</ul>
		<p class="mb-0">您仍可以通过直接访问 <code>https://mirrors.ha.edu.cn/&lt;镜像名&gt;/</code> 来使用镜像服务。</p>
	</div>
</div>

<script src="/static/js/mirror-help.js"></script>
<script>
// 全局变量
let mirrorsData = [];
let mirrorDescriptions = {};
let newMirrors = [];
let unlistedMirrors = [];
let forceRedirectHelpMirrors = [];
let labelMap = {};

// 加载镜像描述数据
async function loadMirrorDescriptions() {
	try {
		const response = await fetch('/static/mirror-desc.json?_=' + Date.now());
		if (!response.ok) {
			throw new Error(`HTTP ${response.status}: ${response.statusText}`);
		}
		
		const data = await response.json();
		
		// 将数组转换为对象，便于快速查找
		if (data.mirror_desc && Array.isArray(data.mirror_desc)) {
			data.mirror_desc.forEach(item => {
				mirrorDescriptions[item.name] = item.desc;
			});
			console.log('加载到镜像描述:', Object.keys(mirrorDescriptions).length, '个');
		}
		
		// 加载新镜像列表
		if (data.new_mirrors && Array.isArray(data.new_mirrors)) {
			newMirrors = data.new_mirrors;
			console.log('加载到新镜像:', newMirrors.length, '个');
		}
		
		// 加载未列出的镜像
		if (data.unlisted_mirrors && Array.isArray(data.unlisted_mirrors)) {
			unlistedMirrors = data.unlisted_mirrors;
			console.log('加载到额外镜像:', unlistedMirrors.length, '个');
		}
		
		// 加载强制重定向到帮助的镜像
		if (data.force_redirect_help_mirrors && Array.isArray(data.force_redirect_help_mirrors)) {
			forceRedirectHelpMirrors = data.force_redirect_help_mirrors;
			console.log('加载到强制重定向镜像:', forceRedirectHelpMirrors.length, '个');
		}
		
		// 加载标签映射
		if (data.label_map && typeof data.label_map === 'object') {
			labelMap = data.label_map;
			console.log('加载到标签映射:', Object.keys(labelMap).length, '个');
		}
		
	} catch (error) {
		console.error('加载镜像描述失败:', error);
		mirrorDescriptions = {};
		newMirrors = [];
		unlistedMirrors = [];
		forceRedirectHelpMirrors = [];
		labelMap = {};
	}
}

// 获取镜像描述
function getMirrorDescription(mirrorName) {
	return mirrorDescriptions[mirrorName] || `${mirrorName} 开源软件镜像`;
}

// 检查是否为新镜像
function isNewMirror(mirrorName) {
	return newMirrors.includes(mirrorName);
}

// 获取新镜像标签
function getNewMirrorBadge(mirrorName) {
	if (isNewMirror(mirrorName)) {
		return '<span class="badge bg-warning text-dark ms-2"><i class="fas fa-star me-1"></i>新镜像</span>';
	}
	return '';
}

// 检查是否有帮助页面
function hasHelpPage(mirrorName) {
	// 这里可以根据实际情况检查是否存在对应的帮助页面
	// 目前简单地认为所有镜像都可能有帮助页面
	return true;
}

// 获取镜像帮助页面URL
function getMirrorHelpUrl(mirrorName) {
	return `/help/${mirrorName}/`;
}

// 自定义排序函数：大写字母优先(A-Z)，然后小写字母(a-z)
function sortMirrorsByName(a, b) {
	const nameA = a.name;
	const nameB = b.name;
	
	// 自定义排序：大写字母优先，然后小写字母
	for (let i = 0; i < Math.min(nameA.length, nameB.length); i++) {
		const charA = nameA[i];
		const charB = nameB[i];
		
		// 如果两个字符都是字母
		if (/[a-zA-Z]/.test(charA) && /[a-zA-Z]/.test(charB)) {
			const isUpperA = /[A-Z]/.test(charA);
			const isUpperB = /[A-Z]/.test(charB);
			
			// 如果一个是大写一个是小写，大写优先
			if (isUpperA && !isUpperB) {
				return -1;
			}
			if (!isUpperA && isUpperB) {
				return 1;
			}
			
			// 如果都是大写或都是小写，按字母顺序比较
			if (charA.toLowerCase() !== charB.toLowerCase()) {
				return charA.toLowerCase().localeCompare(charB.toLowerCase());
			}
			if (charA !== charB) {
				return charA.localeCompare(charB);
			}
		} else {
			// 如果不是字母，直接比较
			if (charA !== charB) {
				return charA.localeCompare(charB);
			}
		}
	}
	
	// 如果前缀相同，按长度排序
	return nameA.length - nameB.length;
}

// 格式化文件大小
function formatSize(sizeStr) {
	if (!sizeStr || sizeStr === 'unknown') return '未知';
	
	// 处理已有单位的情况，如 "20.57G", "1.86T"
	const match = sizeStr.match(/^([\d.]+)([KMGT])$/);
	if (match) {
		const size = parseFloat(match[1]);
		const unit = match[2];
		// 统一保留两位小数
		return `${size.toFixed(2)} ${unit}B`;
	}
	
	// 处理纯数字（字节）
	const bytes = parseInt(sizeStr);
	if (isNaN(bytes)) return sizeStr;
	
	const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
	let size = bytes;
	let unitIndex = 0;
	
	while (size >= 1024 && unitIndex < units.length - 1) {
		size /= 1024;
		unitIndex++;
	}
	
	// 统一保留两位小数
	return `${size.toFixed(2)} ${units[unitIndex]}`;
}

// 格式化时间
function formatTime(timestamp) {
	if (!timestamp || timestamp <= 0) return '未知';
	
	try {
		const date = new Date(timestamp * 1000);
		return date.toLocaleString('zh-CN', {
			year: 'numeric',
			month: '2-digit',
			day: '2-digit',
			hour: '2-digit',
			minute: '2-digit'
		});
	} catch (e) {
		return '未知';
	}
}

// 获取状态标签
function getStatusBadge(status) {
	// 使用 label_map 来映射状态
	const labelClass = labelMap[status] || 'label-default';
	
	// 将 label-* 类转换为 Bootstrap 的 bg-* 类
	const bootstrapClass = labelClass.replace('label-', 'bg-');
	
	const statusText = {
		'success': '同步成功',
		'syncing': '同步中', 
		'failed': '同步失败',
		'fail': '同步失败',
		'warning': '延迟',
		'error': '错误',
		'paused': '暂停',
		'unknown': '未知'
	}[status] || '未知';
	
	return `<span class="badge ${bootstrapClass}">${statusText}</span>`;
}

// 渲染镜像列表
function renderMirrorTable(mirrors) {
	const tbody = document.getElementById('mirror-table-body');
	if (!tbody) return;
	
	tbody.innerHTML = '';
	
	mirrors.forEach(mirror => {
		const row = document.createElement('tr');
		row.className = 'mirror-row';
		
		// 检查是否需要强制重定向到帮助页面
		const shouldRedirectToHelp = forceRedirectHelpMirrors.includes(mirror.name);
		
		// 确定镜像URL
		let mirrorUrl;
		if (shouldRedirectToHelp) {
			mirrorUrl = getMirrorHelpUrl(mirror.name);
		} else if (mirror.url) {
			// 来自 unlisted_mirrors 的镜像，使用指定的URL
			mirrorUrl = mirror.url;
		} else {
			// 普通镜像
			mirrorUrl = `/${mirror.name}/`;
		}
		
		// 检查是否有帮助页面
		const hasHelp = hasHelpPage(mirror.name);
		const helpIcon = hasHelp
			? `<a href="${getMirrorHelpUrl(mirror.name)}" class="ms-2 text-primary mirror-help-link" title="使用帮助"><i class="fas fa-question-circle"></i></a>`
			: '';
		
		// 获取新镜像标签
		const newMirrorBadge = getNewMirrorBadge(mirror.name);
		
		row.innerHTML = `
			<td data-label="镜像名称">
				<strong><a href="${mirrorUrl}" class="text-decoration-none mirror-link" style="color: #0A77FF;" 
					title="${getMirrorDescription(mirror.name)}" data-bs-toggle="tooltip" data-bs-placement="top">${mirror.name}</a></strong>
				${newMirrorBadge}
				${helpIcon}
			</td>
			<td data-label="大小"><small class="text-muted">${formatSize(mirror.size)}</small></td>
			<td data-label="同步状态">${getStatusBadge(mirror.status)}</td>
			<td data-label="最后更新"><small class="text-muted">${formatTime(mirror.last_update_ts)}</small></td>
		`;
		tbody.appendChild(row);
	});
	
	// 初始化 Bootstrap tooltips
	initializeTooltips();
}

// 初始化 tooltips
function initializeTooltips() {
	// 销毁现有的tooltips
	const existingTooltips = document.querySelectorAll('[data-bs-toggle="tooltip"]');
	existingTooltips.forEach(el => {
		const tooltip = bootstrap.Tooltip.getInstance(el);
		if (tooltip) {
			tooltip.dispose();
		}
	});
	
	// 重新初始化tooltips
	const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
	if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
		tooltipTriggerList.forEach(function (tooltipTriggerEl) {
			new bootstrap.Tooltip(tooltipTriggerEl);
		});
	}
}

// 加载镜像数据
async function loadMirrorData() {
	const loadingDiv = document.getElementById('mirror-loading');
	const tableContainer = document.getElementById('mirror-table-container');
	const errorDiv = document.getElementById('mirror-error');
	
	try {
		// 并行加载镜像描述数据和同步状态数据
		await loadMirrorDescriptions();
		
		const response = await fetch('/static/tunasync.json?_=' + Date.now());
		if (!response.ok) {
			throw new Error(`HTTP ${response.status}: ${response.statusText}`);
		}
		
		const data = await response.json();
		
		// 检查数据格式并直接使用数组
		if (Array.isArray(data)) {
			mirrorsData = data;
		} else {
			console.error('tunasync.json格式不正确:', data);
			mirrorsData = [];
		}
		
		// 添加 unlisted_mirrors 到镜像列表中
		unlistedMirrors.forEach(unlistedMirror => {
			// 检查是否已存在同名镜像
			const existingMirror = mirrorsData.find(m => m.name === unlistedMirror.name);
			if (!existingMirror) {
				// 查找对应的 link_to 镜像来继承同步信息
				const linkToMirror = mirrorsData.find(m => m.name === unlistedMirror.link_to);
				
				// 创建虚拟镜像条目，继承 link_to 镜像的同步信息
				const virtualMirror = {
					name: unlistedMirror.name,
					url: unlistedMirror.url,
					link_to: unlistedMirror.link_to
				};
				
				if (linkToMirror) {
					// 继承主镜像的同步信息
					virtualMirror.size = linkToMirror.size || '未知';
					virtualMirror.status = linkToMirror.status || 'unknown';
					virtualMirror.last_update_ts = linkToMirror.last_update_ts || 0;
					virtualMirror.next_schedule_ts = linkToMirror.next_schedule_ts || 0;
					virtualMirror.last_started_ts = linkToMirror.last_started_ts || 0;
					virtualMirror.upstream = linkToMirror.upstream || '';
					console.log(`镜像 ${unlistedMirror.name} 继承了 ${unlistedMirror.link_to} 的同步信息`);
				} else {
					// 如果找不到对应的主镜像，使用默认值
					virtualMirror.size = '未知';
					virtualMirror.status = 'unknown';
					virtualMirror.last_update_ts = 0;
					virtualMirror.next_schedule_ts = 0;
					virtualMirror.last_started_ts = 0;
					virtualMirror.upstream = '';
					console.warn(`未找到 ${unlistedMirror.name} 对应的主镜像 ${unlistedMirror.link_to}`);
				}
				
				mirrorsData.push(virtualMirror);
			}
		});
		
		console.log('加载到镜像数据:', mirrorsData.length, '个镜像（包含额外镜像）');
		
		// 按名称排序：大写字母优先(A-Z)，然后小写字母(a-z)
		mirrorsData.sort(sortMirrorsByName);
		
		// 渲染表格
		renderMirrorTable(mirrorsData);
		
		// 显示表格，隐藏加载状态
		loadingDiv.classList.add('d-none');
		tableContainer.classList.remove('d-none');
		
		// 启用搜索功能
		enableMirrorSearch();
		
	} catch (error) {
		console.error('加载镜像数据失败:', error);
		
		// 显示错误状态
		loadingDiv.classList.add('d-none');
		errorDiv.classList.remove('d-none');
	}
}

// 搜索功能
function enableMirrorSearch() {
	const searchInput = document.getElementById('mirror-search');
	if (!searchInput) return;
	
	searchInput.addEventListener('input', function() {
		const filter = this.value.toLowerCase();
		const rows = document.querySelectorAll('.mirror-row');
		
		rows.forEach(row => {
			const name = row.querySelector('td:first-child').textContent.toLowerCase();
			
			if (name.includes(filter)) {
				row.style.display = '';
			} else {
				row.style.display = 'none';
			}
		});
	});

	// 支持键盘快捷键 "/" 聚焦搜索框
	document.addEventListener('keydown', function(e) {
		if (e.key === '/' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
			e.preventDefault();
			searchInput.focus();
		}
	});
}

// 页面加载时初始化
document.addEventListener('DOMContentLoaded', function() {
	loadMirrorData();
});
</script>
