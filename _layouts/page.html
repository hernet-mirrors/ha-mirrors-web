---
layout: default
---

<link rel="stylesheet" href="{{ '/static/css/page.css' | relative_url }}">

<div class="row">
    <div class="col-md-12">
        <div class="card shadow-sm page-card">
            <div class="card-header page-card-header">
                <h1 class="h3 mb-0">{{ page.title }}</h1>
                {% if page.description %}
                <small class="text-white-50">{{ page.description }}</small>
                {% endif %}
            </div>
            <div class="card-body">
                {{ content }}
            </div>
        </div>
    </div>
</div>
