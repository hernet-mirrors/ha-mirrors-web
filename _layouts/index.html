---
layout: default
---

<link rel="stylesheet" href="{{ '/static/css/index.css' | relative_url }}?v=7">
<link rel="stylesheet" href="{{ '/static/css/index-layout.css' | relative_url }}?v=7">

{% if page.legacy %}
<div class="legacy-wrapper">
  {% include legacy_notes.html %}
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1 class="page-title">开源软件镜像站</h1>
        <p class="page-description">为开源软件提供稳定、快速的镜像服务</p>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        {{ content }}
      </div>
    </div>
  </div>
</div>
{% else %}
<div class="mirrors-container">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm index-card">
          <div class="card-body">
            {{ content }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endif %}

<script src="{{ '/static/js/index-layout.js' | relative_url }}" defer></script>
