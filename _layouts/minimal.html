<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    
    <!-- Meta tags -->
    <meta name="description" content="{{ page.description | default: site.desc }}">
    <meta name="author" content="{{ site.author }}">
    <meta name="robots" content="{% if site.maintenance.enabled and page.url != '/maintenance/' %}noindex, nofollow{% else %}index, follow{% endif %}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/static/img/favicon.ico' | relative_url }}">
    
    <!-- CSS -->
    <link href="{{ '/static/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
    <link href="{{ '/static/css/all.min.css' | relative_url }}" rel="stylesheet">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.desc }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:site_name" content="{{ site.title }}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.desc }}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    
    <!-- Custom styles for minimal layout -->
    <style>
        /* Reset and base styles */
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        /* Utility classes */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
    </style>
</head>
<body>
    <!-- Main content -->
    <main id="main-content">
        {{ content }}
    </main>
    
    <!-- Basic JavaScript for Bootstrap functionality if needed -->
    <script src="{{ '/static/js/bootstrap.bundle.min.js' | relative_url }}"></script>
    
    <!-- Basic error handling -->
    <script>
        // Global error handler
        window.addEventListener('error', function(e) {
            console.error('Page error:', e.filename, e.lineno, e.message);
        });
        
        // Handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
        });
    </script>
</body>
</html>
