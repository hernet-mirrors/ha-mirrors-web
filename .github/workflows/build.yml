name: Docker build

on:
  push:
    branches: [main, nyist-web]
  pull_request:
    branches: [main, nyist-web]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_IMAGE: ha-mirrors-web:ci
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout source and documentation
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the existing Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build
          tags: ${{ env.BUILD_IMAGE }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read the branch's site hostname
        run: |
          docker run --rm --volume "$PWD:/data:ro" "$BUILD_IMAGE" \
            ruby -ryaml -e 'puts "SITE_HOST=#{YAML.load_file("_config.yml").fetch("hostname")}"' >> "$GITHUB_ENV"

      - name: Fetch runtime data for the build
        run: |
          mkdir -p static
          for name in disk.json tunasync.json isoinfo.json; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              "https://$SITE_HOST/static/$name" --output "static/$name"
          done

      - name: Build Jekyll and production JavaScript
        run: docker run --rm --volume "$PWD:/data" "$BUILD_IMAGE"
