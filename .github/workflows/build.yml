name: Docker build

on:
  push:
    branches: [main, nyist-web]
  pull_request:
    branches: [main, nyist-web]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BUILD_IMAGE: ha-mirrors-web:ci
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Checkout source and documentation
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the existing Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.build
          tags: ${{ env.BUILD_IMAGE }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read the branch's site hostname
        run: |
          docker run --rm --volume "$PWD:/data:ro" "$BUILD_IMAGE" \
            ruby -ryaml -e 'puts "SITE_HOST=#{YAML.load_file("_config.yml").fetch("hostname")}"' >> "$GITHUB_ENV"

      - name: Fetch runtime data for the build
        run: |
          mkdir -p static
          for name in disk.json tunasync.json isoinfo.json; do
            for attempt in 1 2 3 4 5; do
              snapshot="$(mktemp)"
              if curl --fail --silent --show-error --location \
                --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
                "https://$SITE_HOST/static/$name" --output "$snapshot" && \
                python3 -m json.tool "$snapshot" > /dev/null 2>&1; then
                mv "$snapshot" "static/$name"
                break
              fi
              rm -f "$snapshot"
              if [[ "$attempt" == 5 ]]; then
                echo "Invalid or unavailable runtime JSON: $name" >&2
                exit 1
              fi
              sleep 2
            done
          done

      - name: Build Jekyll and production JavaScript
        run: docker run --rm --volume "$PWD:/data" "$BUILD_IMAGE"

      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish the verified build image
        if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          branch_tag="$image:$GITHUB_REF_NAME"
          commit_tag="$image:sha-${GITHUB_SHA:0:12}"
          docker tag "$BUILD_IMAGE" "$branch_tag"
          docker tag "$BUILD_IMAGE" "$commit_tag"
          docker push "$branch_tag"
          docker push "$commit_tag"
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            docker tag "$BUILD_IMAGE" "$image:latest"
            docker push "$image:latest"
          fi
