# Jekyll配置文件 - 基于TUNA mirror-web架构
title: "河南省教育科研网开源软件镜像站"
desc: "河南省教育科研网(HERNET)开源软件镜像站，为河南省高校和科研院所提供开源软件镜像服务"
url: "https://mirrors.ha.edu.cn"
hostname: "mirrors.ha.edu.cn"
baseurl: ""

# 站点信息
school: "河南省教育科研网"
brand: "HERNET"
author: "河南省教育科研网镜像站"
email: "mirrors@ha.edu.cn"

# 主站链接
homelink: "https://www.ha.edu.cn"

# 构建设置
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'codehilite'

# 插件
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-titles-from-headings

# 分页配置
paginate: 10
paginate_path: "/news/page:num/"

# 集合配置
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title/

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - package.json
  - package-lock.json
  - _vite.config.mjs
  - _src
  - Dockerfile.build
  - geninfo

# 静态文件
static_files:
  - tunasync.json
  - status

# 默认值
defaults:
  - scope:
      path: "help/_posts"
      type: "posts"
    values:
      layout: "help"
      category: "help"
  - scope:
      path: "news/_posts"
      type: "posts"
    values:
      layout: "news"
      category: "news"

# 其他配置
timezone: Asia/Shanghai
safe: false
incremental: false

# 镜像站信息
mirror_info:
  name: "河南省教育科研网镜像站"
  description: "为河南省高校和科研院所提供开源软件镜像服务"
  location: "中国 河南 郑州"
