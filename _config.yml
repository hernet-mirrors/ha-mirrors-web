title: "南阳理工学院开源镜像站"
desc: "南阳理工学院开源镜像站，致力于为国内和校内用户提供高质量的开源软件镜像、Linux 镜像源服务，由南阳理工学院 CIPS 协会负责运行维护"
url: "https://mirror.nyist.edu.cn"
urlv4: "https://mirror4.nyist.edu.cn"
urlv6: "https://mirror6.nyist.edu.cn"
hostname: "mirror.nyist.edu.cn"
baseurl: ""

school: "南阳理工学院"
brand: "NYIST"
author: "南阳理工学院 CIPS 协会"
email: "cips@nyist.edu.cn"

homelink: "https://cips.nyist.edu.cn"

# Header 显示配置
# brand_visible: 是否显示左侧的两个 logo (河南省教育科研网 + HERNET Mirror)
#                默认 true，设为 false 则仅显示中间导航。
header:
  brand_visible: true

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'codehilite'

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-titles-from-headings

paginate: 10
paginate_path: "/news/page:num/"

collections:
  posts:
    output: true
    permalink: /:categories/:title/

# mirrorz-docs 风格帮助页面（由 _plugins/helpz.rb 构建）
helpz:
  language: zh
  dir: _helpz
  generator: generate.mjs
  enabled_pages_file: enabled.yaml
  collection:
    label: help

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - package.json
  - package-lock.json
  - _vite.config.mjs
  - _src
  - _helpz
  - Dockerfile.build
  - geninfo
  - scripts
  - node_modules
  - .github
  - .gitignore
  - .git
  - .DS_Store
  - nginx-*.conf
  - mirror-web
  - LICENSE

static_files:
  - static

# Jekyll defaults: applied to the helpz-generated collection.
defaults:
  - scope:
      path: ""
      type: help
    values:
      layout: help
      permalink: /help/:name/
      excerpt_separator: ""
  - scope:
      path: "news/_posts"
      type: "posts"
    values:
      layout: "news"
      category: "news"

timezone: Asia/Shanghai
safe: false
incremental: false

# 维护模式配置
maintenance:
  enabled: false
  start_time: "2025年7月12日 2:00"
  end_time: "2025年7月13日 02:00"
  reason: "镜像站硬件维护"
  contact_email: "cips@nyist.edu.cn"

mirror_info:
  name: "南阳理工学院开源镜像站"
  description: "为国内和校内用户提供高质量的开源软件镜像服务"
  location: "中国 河南 南阳"
