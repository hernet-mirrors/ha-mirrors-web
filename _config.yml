title: "河南省教育科研网开源软件镜像站"
desc: "河南省教育科研网(HERNET)开源软件镜像站，为河南省高校和科研院所提供开源软件镜像服务"
url: "https://mirrors.ha.edu.cn"
urlv4: "https://mirrors4.ha.edu.cn"
urlv6: "https://mirrors6.ha.edu.cn"
hostname: "mirrors.ha.edu.cn"
baseurl: ""

school: "河南省教育科研网"
brand: "HERNET"
author: "河南省教育科研网镜像站"
email: "mirrors@ha.edu.cn"

homelink: "https://www.ha.edu.cn"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'codehilite'

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-titles-from-headings

paginate: 10
paginate_path: "/news/page:num/"

collections:
  posts:
    output: true
    permalink: /:categories/:title/

# mirrorz-docs 风格帮助页面（由 _plugins/helpz.rb 构建）
helpz:
  language: zh
  dir: _helpz
  generator: generate.mjs
  enabled_pages_file: enabled.yaml
  collection:
    label: help

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - README.md
  - package.json
  - package-lock.json
  - _vite.config.mjs
  - _src
  - _helpz
  - Dockerfile.build
  - geninfo
  - scripts
  - node_modules
  - .github
  - .gitignore
  - .git
  - .DS_Store
  - nginx-*.conf

static_files:
  - static

# Jekyll defaults: applied to the helpz-generated collection.
defaults:
  - scope:
      path: ""
      type: help
    values:
      layout: help
      permalink: /help/:name/
      excerpt_separator: ""
  - scope:
      path: "news/_posts"
      type: "posts"
    values:
      layout: "news"
      category: "news"

timezone: Asia/Shanghai
safe: false
incremental: false

# 维护模式配置
maintenance:
  enabled: false
  start_time: "2025年7月12日 2:00"
  end_time: "2025年7月13日 02:00"
  reason: "镜像站硬件维护"
  contact_email: "mirrors@ha.edu.cn"

mirror_info:
  name: "河南省教育科研网镜像站"
  description: "为河南省高校和科研院所提供开源软件镜像服务"
  location: "中国 河南 郑州"
